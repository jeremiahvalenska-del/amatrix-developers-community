<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Générateur Exposé - Campus Hub</title><link rel="stylesheet" href="style-pages.css"></head><body>
<header><a href="menu.html">←</a><div class="logo"><b>Campus <span>Hub</span></b></div></header>
<div class="page"><div class="hero"><div class="bg" style="background-image:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800')"></div><div class="ct"><h1>Générateur d'Exposé</h1><p>Préparez un exposé clair et bien structuré - 10 000 caractères</p></div></div>
<div class="pageCard">
<textarea class="input" style="height:160px" maxlength="10000" placeholder="Sujet, notes, consignes, informations, plan, sources, objectifs... 10 000 caractères" oninput="this.nextElementSibling.textContent=this.value.length+'/10000'"></textarea><div style="text-align:right;font-size:10px;color:#7b8aa0">0/10000</div>
<br><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label>Nom</label><input class="input"></div><div><label>Université</label><input class="input"></div><div><label>Faculté</label><input class="input"></div><div><label>Département</label><input class="input"></div><div><label>Filière</label><input class="input"></div><div><label>Promotion : [________________]</label><input class="input" placeholder="L1, L2, L3, Licence 1, Licence 2, Licence 3, Master 1, Master 2"></div><div><label>Matière</label><input class="input"></div><div><label>Enseignant</label><input class="input"></div><div><label>Sujet</label><input class="input"></div><div><label>Année</label><input class="input"></div>
</div><br><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag">Introduction</span><span class="tag">Développement</span><span class="tag">Parties</span><span class="tag">Sous-parties</span><span class="tag">Exemples</span><span class="tag">Conclusion</span><span class="tag">Bibliographie</span><span class="tag">Mise en page</span><span class="tag">Correction</span></div>
<br><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"><div class="listItem" style="justify-content:center">Garde 1</div><div class="listItem" style="justify-content:center">Garde 2</div><div class="listItem" style="justify-content:center">Garde 3</div><div class="listItem" style="justify-content:center">Garde 4</div><div class="listItem" style="justify-content:center">Garde 5</div><div class="listItem" style="justify-content:center">Garde 6</div><div class="listItem" style="justify-content:center">Garde 7</div><div class="listItem" style="justify-content:center">Garde 8</div><div class="listItem" style="justify-content:center">Garde 9</div><div class="listItem" style="justify-content:center">Garde 10</div></div>
<br><button class="btn">Aperçu</button> <button class="btn">Téléchargement</button>
</div></div></body></html>
